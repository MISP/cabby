name: Tox

on:
  - pull_request

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.6', '3.7', '3.8', '3.9', '3.12']

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      if: matrix.python-version != '3.6'
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      if: matrix.python-version != '3.6'
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox tox-gh-actions
    - name: Test with tox
      if: matrix.python-version != '3.6'
      run: python -m tox
    # setup-python has no Python 3.6 build for supported Ubuntu runners.
    - name: Test Python 3.6 in Docker
      if: matrix.python-version == '3.6'
      run: |
        docker run --rm -v "$PWD:/cabby" -w /cabby python:3.6-bullseye \
          sh -ec 'python -m pip install tox && python -m tox -e py36'
