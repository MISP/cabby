name: Tox

on:
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: '3.11'
            tox-env: py311
          - python-version: '3.12'
            tox-env: py312,flake8

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - run: python -m pip install tox
    - run: python -m tox -e ${{ matrix.tox-env }}
