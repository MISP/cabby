name: Tox

on:
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: '3.11'
            tox-env: py311
          - python-version: '3.12'
            tox-env: py312,flake8

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: '0.13.6'
    - run: uvx --python ${{ matrix.python-version }} --with tox-uv tox -e ${{ matrix.tox-env }}
