project:
  type: book
  output-dir: _book

book:
  title: Cabby
  subtitle: Python TAXII client
  author: The MISP Project
  site-url: https://misp.github.io/cabby/
  repo-url: https://github.com/MISP/cabby
  repo-branch: master
  repo-subdir: docs
  repo-actions: [edit, issue]
  favicon: assets/misp-2-verti.png
  search: true
  sidebar:
    logo: assets/misp-2-verti.png
    style: docked
    collapse-level: 1
  page-footer:
    left: "© 2016, EclecticIQ. © 2026, MISP project. [License](license.qmd)"
    right: "Built with [Quarto](https://quarto.org)"
  chapters:
    - index.qmd
    - part: Using Cabby
      chapters:
        - installation.qmd
        - taxii21.qmd
        - user.qmd
    - part: Reference
      chapters:
        - api.qmd
        - developer.qmd
        - changes.qmd
        - license.qmd

format:
  html:
    grid:
      sidebar-width: 260px
      body-width: 850px
      margin-width: 220px
    theme:
      light: [cosmo, assets/misp.scss]
      dark: [darkly, assets/misp.scss]
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    code-block-bg: true
    link-external-newwindow: true
    number-sections: false
