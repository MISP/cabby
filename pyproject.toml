[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cabby"
dynamic = ["version", "dependencies"]
description = "TAXII client library"
readme = "README.rst"
requires-python = ">=3.11,<3.13"
license = "BSD-3-Clause"
license-files = ["LICENSE.rst"]
authors = [{name = "EclecticIQ", email = "cabby@eclecticiq.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/MISP/cabby"

[project.scripts]
taxii-proxy = "cabby.cli:proxy_content"
taxii-poll = "cabby.cli:poll_content"
taxii-push = "cabby.cli:push_content"
taxii-discovery = "cabby.cli:discover_services"
taxii-collections = "cabby.cli:fetch_collections"
taxii-subscription = "cabby.cli:manage_subscription"

[tool.setuptools.dynamic]
version = {attr = "cabby._version.__version__"}
dependencies = {file = "requirements.txt"}

[tool.setuptools.packages.find]
include = ["cabby", "cabby.*"]
namespaces = false
