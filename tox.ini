[tox]
envlist = flake8,py36,py37,py38,py39,py312

[gh-actions]
python =
    3.6: py36
    3.7: py37
    3.8: py38
    3.9: py39
    3.12: py312, flake8

[testenv]
commands = python -m pytest --cov=cabby {posargs}
deps =
    -rrequirements-dev.txt

[testenv:flake8]
basepython = python3
skip_install = true
deps = flake8
commands = flake8
